<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Villa Devonté — Stay. Dine. Unwind. Experience.</title>
<meta name="description" content="Villa Devonté is a luxury villa, restaurant, lounge and hot tub destination in Lekki, Lagos. Reserve rooms, order food & drinks, book the hot tub and buy event tickets — all via WhatsApp.">
<meta name="theme-color" content="#492A15">
<meta property="og:title" content="Villa Devonté — Stay. Dine. Unwind. Experience.">
<meta property="og:description" content="A premium hospitality destination. Rooms, restaurant, lounge, hot tub and events.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   0. TOKENS
   ============================================================ */
:root{
  --brand:#492A15;
  --brand-dark:#2E1A0D;
  --sand:#DBC1AC;
  --sand-soft:#F5EDE6;
  --ink:#141110;
  --muted:#6E6157;
  --line:rgba(73,42,21,.14);
  --white:#fff;
  --wa:#25D366;
  --radius:6px;
  --max:1240px;
  --header-h:74px;
  --ff-display:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --ff-body:'Jost', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;font-family:var(--ff-body);font-weight:300;font-size:16px;line-height:1.72;
  color:var(--ink);background:var(--white);overflow-x:hidden;
}
body.no-scroll{overflow:hidden}
img{max-width:100%;display:block;border:0}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,h5{font-family:var(--ff-display);font-weight:400;line-height:1.12;margin:0;letter-spacing:.005em}
p{margin:0 0 1rem}
ul{margin:0;padding:0;list-style:none}
::selection{background:var(--sand);color:var(--brand-dark)}

/* ============================================================
   1. LAYOUT PRIMITIVES
   ============================================================ */
.container{width:100%;max-width:var(--max);margin:0 auto;padding:0 22px}
.section{padding:clamp(56px,8.5vw,110px) 0}
.section--tight{padding:clamp(40px,6vw,72px) 0}
.section--sand{background:var(--sand-soft)}
.section--brand{background:var(--brand);color:var(--white)}
.section--dark{background:var(--brand-dark);color:var(--white)}
.section--brand .eyebrow,.section--dark .eyebrow{color:var(--sand)}
.section--brand .lead,.section--dark .lead{color:rgba(255,255,255,.72)}

.eyebrow{
  display:block;font-size:.66rem;letter-spacing:.34em;text-transform:uppercase;
  color:var(--brand);opacity:.8;margin-bottom:1.1rem;font-weight:400;
}
.h-display{font-size:clamp(2.4rem,6.5vw,4.6rem);letter-spacing:.02em}
.h-section{font-size:clamp(1.85rem,4.2vw,3rem)}
.h-sub{font-size:clamp(1.3rem,2.4vw,1.75rem)}
.lead{font-size:clamp(.98rem,1.5vw,1.08rem);color:var(--muted);max-width:64ch;font-weight:300}
.center{text-align:center}
.center .lead{margin-left:auto;margin-right:auto}
.mb-1{margin-bottom:.5rem}.mb-2{margin-bottom:1rem}.mb-3{margin-bottom:1.6rem}.mb-4{margin-bottom:2.4rem}
.mt-3{margin-top:1.6rem}.mt-4{margin-top:2.4rem}

.grid{display:grid;gap:clamp(18px,2.4vw,28px)}
.g-2{grid-template-columns:repeat(2,1fr)}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1000px){.g-3,.g-4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.g-2,.g-3,.g-4{grid-template-columns:1fr}}

.split{display:grid;grid-template-columns:1fr 1fr;gap:clamp(26px,5vw,74px);align-items:center}
.split--rev .split-media{order:2}
@media(max-width:880px){.split{grid-template-columns:1fr}.split--rev .split-media{order:0}}

/* ============================================================
   2. BUTTONS
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.6rem;
  padding:1rem 1.85rem;font-family:var(--ff-body);font-size:.7rem;font-weight:500;
  letter-spacing:.18em;text-transform:uppercase;border:1px solid transparent;
  border-radius:2px;cursor:pointer;transition:all .35s ease;white-space:nowrap;
  background:transparent;line-height:1;
}
.btn svg{width:15px;height:15px;flex:none}
.btn-primary{background:var(--brand);color:var(--white);border-color:var(--brand)}
.btn-primary:hover{background:var(--brand-dark);border-color:var(--brand-dark)}
.btn-sand{background:var(--sand);color:var(--brand-dark);border-color:var(--sand)}
.btn-sand:hover{background:var(--white);border-color:var(--white)}
.btn-ghost{border-color:rgba(255,255,255,.6);color:var(--white)}
.btn-ghost:hover{background:var(--white);color:var(--brand);border-color:var(--white)}
.btn-outline{border-color:var(--brand);color:var(--brand)}
.btn-outline:hover{background:var(--brand);color:var(--white)}
.btn-wa{background:var(--wa);color:#fff;border-color:var(--wa)}
.btn-wa:hover{background:#1eb356;border-color:#1eb356}
.btn-sm{padding:.72rem 1.15rem;font-size:.63rem;letter-spacing:.14em}
.btn-block{width:100%}
.btn-row{display:flex;flex-wrap:wrap;gap:.8rem}
@media(max-width:480px){.btn{padding:.92rem 1.3rem;font-size:.66rem;letter-spacing:.13em}}

/* ============================================================
   3. HEADER + NAV
   ============================================================ */
.site-header{
  position:fixed;top:0;left:0;right:0;z-index:200;height:var(--header-h);
  display:flex;align-items:center;color:var(--white);
  background:transparent;transition:background .45s ease,color .45s ease,box-shadow .45s ease;
}
.site-header.solid{
  background:rgba(255,255,255,.97);color:var(--brand);
  box-shadow:0 1px 0 var(--line);backdrop-filter:blur(12px);
}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:20px;width:100%}
.logo{
  font-family:var(--ff-display);font-size:1.28rem;letter-spacing:.26em;
  text-transform:uppercase;font-weight:400;white-space:nowrap;
}
.logo span{color:var(--sand)}
.site-header.solid .logo span{color:var(--brand);opacity:.65}

.nav{display:flex;align-items:center;gap:clamp(12px,1.6vw,22px)}
.nav a{
  font-size:.66rem;letter-spacing:.15em;text-transform:uppercase;font-weight:400;
  opacity:.86;transition:opacity .3s;position:relative;padding:4px 0;
}
.nav a::after{
  content:'';position:absolute;left:0;right:100%;bottom:0;height:1px;
  background:currentColor;transition:right .35s ease;
}
.nav a:hover{opacity:1}
.nav a:hover::after,.nav a.active::after{right:0}
.nav a.active{opacity:1}
.header-cta{display:flex;align-items:center;gap:12px}
@media(max-width:1180px){.nav{display:none}}
@media(max-width:1180px){.header-cta .btn{display:none}}

.hamburger{
  display:none;width:44px;height:44px;align-items:center;justify-content:center;
  background:none;border:0;cursor:pointer;color:inherit;padding:0;
}
.hamburger span{display:block;width:24px;height:1.5px;background:currentColor;position:relative;transition:.3s}
.hamburger span::before,.hamburger span::after{
  content:'';position:absolute;left:0;width:24px;height:1.5px;background:currentColor;transition:.3s;
}
.hamburger span::before{top:-7px}
.hamburger span::after{top:7px}
@media(max-width:1180px){.hamburger{display:flex}}

/* Mobile drawer */
.drawer{
  position:fixed;inset:0;z-index:300;background:var(--brand-dark);color:var(--white);
  display:flex;flex-direction:column;padding:22px;
  transform:translateY(-100%);opacity:0;visibility:hidden;
  transition:transform .5s cubic-bezier(.6,0,.2,1),opacity .4s,visibility .4s;
  overflow-y:auto;
}
.drawer.open{transform:translateY(0);opacity:1;visibility:visible}
.drawer-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:clamp(24px,7vh,60px)}
.drawer-close{background:none;border:0;color:var(--white);font-size:1.9rem;line-height:1;cursor:pointer;padding:6px 10px}
.drawer nav{display:flex;flex-direction:column;gap:2px;flex:1}
.drawer nav a{
  font-family:var(--ff-display);font-size:clamp(1.5rem,6vw,2rem);
  padding:.55rem 0;border-bottom:1px solid rgba(219,193,172,.14);
  display:flex;align-items:center;justify-content:space-between;transition:.3s;color:var(--white);
}
.drawer nav a:hover{color:var(--sand);padding-left:8px}
.drawer nav a small{font-family:var(--ff-body);font-size:.6rem;letter-spacing:.2em;opacity:.4}
.drawer-foot{margin-top:28px;display:flex;flex-direction:column;gap:12px}
.drawer-foot .btn{width:100%}

/* ============================================================
   4. HERO CAROUSEL
   ============================================================ */
.hero{position:relative;height:100svh;min-height:600px;max-height:1000px;overflow:hidden;background:var(--brand-dark)}
.hero-slide{position:absolute;inset:0;opacity:0;transition:opacity 1.5s ease-in-out;pointer-events:none;will-change:opacity}
.hero-slide.active{opacity:1;pointer-events:auto}
.hero-slide .hero-media{position:absolute;inset:0}
.hero-slide .hero-media img{width:100%;height:100%;object-fit:cover}
.hero-slide.active .hero-media img{animation:kenburns 8s ease-out forwards}
@keyframes kenburns{from{transform:scale(1.02)}to{transform:scale(1.11)}}
.hero-overlay{
  position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(20,10,4,.62) 0%,rgba(20,10,4,.30) 38%,rgba(20,10,4,.78) 100%);
}
.hero-content{
  position:relative;z-index:3;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;color:var(--white);
  padding-top:var(--header-h);padding-bottom:96px;
}
.hero-kicker{
  font-size:.68rem;letter-spacing:.4em;text-transform:uppercase;color:var(--sand);
  margin-bottom:1.1rem;opacity:0;transform:translateY(14px);
}
.hero-title{
  font-size:clamp(2.6rem,9vw,6.2rem);letter-spacing:.06em;line-height:1;
  margin-bottom:1.1rem;opacity:0;transform:translateY(20px);
}
.hero-sub{
  font-size:clamp(.92rem,2.1vw,1.15rem);letter-spacing:.16em;text-transform:uppercase;
  color:rgba(255,255,255,.86);font-weight:300;margin-bottom:2.1rem;max-width:34ch;
  opacity:0;transform:translateY(20px);
}
.hero-actions{display:flex;flex-wrap:wrap;gap:.85rem;justify-content:center;opacity:0;transform:translateY(20px)}
.hero-slide.active .hero-kicker{animation:heroIn .9s .25s cubic-bezier(.2,.7,.3,1) forwards}
.hero-slide.active .hero-title{animation:heroIn .9s .4s cubic-bezier(.2,.7,.3,1) forwards}
.hero-slide.active .hero-sub{animation:heroIn .9s .55s cubic-bezier(.2,.7,.3,1) forwards}
.hero-slide.active .hero-actions{animation:heroIn .9s .7s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes heroIn{to{opacity:1;transform:translateY(0)}}

.hero-ui{position:absolute;left:0;right:0;bottom:34px;z-index:5;display:flex;align-items:center;justify-content:center;gap:22px}
.hero-dots{display:flex;gap:11px}
.hero-dot{
  width:34px;height:2px;background:rgba(255,255,255,.32);border:0;padding:0;cursor:pointer;
  transition:background .4s;position:relative;overflow:hidden;
}
.hero-dot::after{content:'';position:absolute;inset:0;background:var(--sand);transform:scaleX(0);transform-origin:left;transition:transform .3s}
.hero-dot.active::after{animation:dotFill 6.5s linear forwards}
@keyframes dotFill{to{transform:scaleX(1)}}
.hero-arrow{
  width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.42);
  background:rgba(0,0,0,.18);color:#fff;cursor:pointer;display:flex;align-items:center;
  justify-content:center;transition:.3s;backdrop-filter:blur(4px);
}
.hero-arrow:hover{background:var(--sand);color:var(--brand-dark);border-color:var(--sand)}
.hero-arrow svg{width:15px;height:15px}
@media(max-width:620px){.hero-arrow{display:none}.hero-ui{bottom:26px}}

/* ============================================================
   5. MEDIA + CARDS
   ============================================================ */
.media{position:relative;overflow:hidden;background:var(--sand-soft);border-radius:var(--radius)}
.media img{width:100%;height:100%;object-fit:cover;transition:transform .9s cubic-bezier(.2,.7,.3,1)}
.ratio-16x9{aspect-ratio:16/9}
.ratio-4x3{aspect-ratio:4/3}
.ratio-3x2{aspect-ratio:3/2}
.ratio-1x1{aspect-ratio:1/1}
.ratio-3x4{aspect-ratio:3/4}
.ratio-2x3{aspect-ratio:2/3}
.media-tall{aspect-ratio:4/5}
a.media:hover img,.card:hover .media img{transform:scale(1.06)}

.card{
  background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;display:flex;flex-direction:column;
  transition:transform .45s cubic-bezier(.2,.7,.3,1),box-shadow .45s ease;
}
.card:hover{transform:translateY(-5px);box-shadow:0 30px 60px -38px rgba(73,42,21,.75)}
.card-body{padding:clamp(18px,2.2vw,26px);display:flex;flex-direction:column;gap:.55rem;flex:1}
.card-title{font-size:clamp(1.2rem,2vw,1.5rem);line-height:1.2}
.card-text{font-size:.9rem;color:var(--muted);line-height:1.65;flex:1;margin:0}
.card-meta{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--brand);opacity:.75}
.card-price{font-family:var(--ff-display);font-size:1.35rem;color:var(--brand);line-height:1}
.card-price small{font-family:var(--ff-body);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;opacity:.6;display:block;margin-top:4px}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:.9rem;flex-wrap:wrap}
.tag{
  display:inline-block;font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;
  padding:5px 10px;border-radius:100px;background:var(--sand-soft);color:var(--brand);font-weight:400;
}
.tag--solid{background:var(--brand);color:var(--white)}
.tag--sand{background:var(--sand);color:var(--brand-dark)}
.chip-row{display:flex;flex-wrap:wrap;gap:8px}

.amenities{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 18px;margin-top:6px}
.amenities li{font-size:.88rem;color:var(--muted);display:flex;gap:9px;align-items:flex-start;line-height:1.5}
.amenities li::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--sand);flex:none;margin-top:9px}
@media(max-width:520px){.amenities{grid-template-columns:1fr}}

.spec-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:20px 0;margin:22px 0}
.spec-list dt{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.spec-list dd{margin:0;font-family:var(--ff-display);font-size:1.12rem;color:var(--brand)}

/* Section header */
.sec-head{max-width:760px;margin-bottom:clamp(28px,4vw,52px)}
.sec-head.center{margin-left:auto;margin-right:auto}
.sec-head .lead{margin-bottom:0}

/* Divider */
.rule{height:1px;background:var(--line);border:0;margin:0}

/* ============================================================
   6. FORMS
   ============================================================ */
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.field{display:flex;flex-direction:column;gap:8px}
.field-full{grid-column:1/-1}
.field label{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{
  width:100%;padding:14px 15px;border:1px solid var(--line);border-radius:2px;
  background:var(--white);font-size:.95rem;font-weight:300;transition:border-color .3s,box-shadow .3s;
  appearance:none;-webkit-appearance:none;
}
.field select{background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23492A15' stroke-width='1.6'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 13px center;background-size:17px;padding-right:40px}
.field textarea{resize:vertical;min-height:96px}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(73,42,21,.08);
}
.form-note{grid-column:1/-1;font-size:.78rem;color:var(--muted);margin:0}
@media(max-width:620px){.form{grid-template-columns:1fr}}

/* Quantity stepper */
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.qty button{
  width:34px;height:34px;background:none;border:0;cursor:pointer;font-size:1rem;
  color:var(--brand);display:flex;align-items:center;justify-content:center;transition:.25s;
}
.qty button:hover{background:var(--sand-soft)}
.qty-val{min-width:32px;text-align:center;font-size:.86rem;font-variant-numeric:tabular-nums}

/* ============================================================
   7. MENU
   ============================================================ */
.menu-tabs{
  display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;margin-bottom:34px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;border-bottom:1px solid var(--line);
}
.menu-tabs::-webkit-scrollbar{display:none}
.menu-tab{
  flex:none;padding:11px 17px;border:1px solid var(--line);background:var(--white);
  border-radius:100px;font-size:.63rem;letter-spacing:.16em;text-transform:uppercase;
  cursor:pointer;transition:.3s;color:var(--brand);white-space:nowrap;
}
.menu-tab:hover{border-color:var(--sand)}
.menu-tab.active{background:var(--brand);color:var(--white);border-color:var(--brand)}
.menu-cat{margin-bottom:clamp(34px,5vw,58px);scroll-margin-top:110px}
.menu-cat-head{display:flex;align-items:baseline;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.menu-cat-head h3{font-size:clamp(1.4rem,3vw,2rem)}
.menu-cat-head span{font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.menu-item{display:flex;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.menu-item-media{width:96px;flex:none;border-radius:4px;overflow:hidden;aspect-ratio:1/1;background:var(--sand-soft)}
.menu-item-media img{width:100%;height:100%;object-fit:cover;transition:transform .7s}
.menu-item:hover .menu-item-media img{transform:scale(1.07)}
.menu-item-main{flex:1;min-width:0}
.menu-item-top{display:flex;justify-content:space-between;gap:14px;align-items:baseline}
.menu-item-name{font-family:var(--ff-display);font-size:1.16rem;line-height:1.25}
.menu-item-price{font-family:var(--ff-display);font-size:1.16rem;color:var(--brand);white-space:nowrap}
.menu-item-desc{font-size:.86rem;color:var(--muted);line-height:1.6;margin:5px 0 10px}
.menu-item-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
@media(max-width:520px){.menu-item-media{width:74px}}

/* Order tray */
.order-tray{
  position:fixed;left:0;right:0;bottom:0;z-index:150;background:var(--brand-dark);color:var(--white);
  padding:14px 0;transform:translateY(110%);transition:transform .45s cubic-bezier(.2,.7,.3,1);
  box-shadow:0 -14px 40px -20px rgba(0,0,0,.6);
}
.order-tray.open{transform:translateY(0)}
.order-tray-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.order-tray-info{display:flex;flex-direction:column;gap:2px}
.order-tray-count{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--sand)}
.order-tray-total{font-family:var(--ff-display);font-size:1.35rem}
.order-tray-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.order-tray .btn-ghost{border-color:rgba(255,255,255,.4)}
@media(max-width:520px){
  .order-tray-inner{gap:10px}
  .order-tray-total{font-size:1.15rem}
  .order-tray-actions .btn{padding:.7rem 1rem;font-size:.6rem}
}

/* ============================================================
   8. FLOATING WHATSAPP
   ============================================================ */
.wa-float{
  position:fixed;right:16px;bottom:16px;z-index:160;
  display:inline-flex;align-items:center;gap:10px;
  background:var(--wa);color:#fff;padding:14px 20px 14px 16px;border-radius:100px;
  font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;font-weight:500;
  box-shadow:0 16px 36px -12px rgba(37,211,102,.75);
  transition:transform .35s cubic-bezier(.2,.7,.3,1),box-shadow .35s,bottom .4s ease;
  border:0;cursor:pointer;
}
.wa-float:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 20px 42px -12px rgba(37,211,102,.9)}
.wa-float svg{width:20px;height:20px;flex:none}
body.tray-open .wa-float{bottom:104px}
@media(max-width:620px){
  .wa-float{right:12px;bottom:12px;padding:13px 16px;font-size:.58rem;letter-spacing:.1em;gap:8px}
  body.tray-open .wa-float{bottom:118px}
}
@media(max-width:380px){.wa-float .wa-label{display:none}.wa-float{padding:15px;border-radius:50%}}

/* ============================================================
   9. EVENTS
   ============================================================ */
.tabbar{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:36px}
.tabbar button{
  background:none;border:0;padding:14px 22px;cursor:pointer;
  font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
  border-bottom:1px solid transparent;margin-bottom:-1px;transition:.3s;
}
.tabbar button.active{color:var(--brand);border-bottom-color:var(--brand)}
@media(max-width:520px){.tabbar button{padding:13px 14px;font-size:.6rem;letter-spacing:.14em}}

.event-card{position:relative}
.event-date{
  position:absolute;top:14px;left:14px;z-index:2;background:rgba(255,255,255,.95);
  color:var(--brand);padding:9px 12px;border-radius:3px;text-align:center;line-height:1.1;
  backdrop-filter:blur(6px);
}
.event-date b{display:block;font-family:var(--ff-display);font-size:1.3rem;font-weight:500}
.event-date span{font-size:.55rem;letter-spacing:.18em;text-transform:uppercase;opacity:.75}

.ticket-row{
  display:flex;align-items:flex-start;justify-content:space-between;gap:18px;
  padding:20px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;
}
.ticket-info{flex:1;min-width:210px}
.ticket-name{font-family:var(--ff-display);font-size:1.25rem;margin-bottom:4px}
.ticket-includes{font-size:.84rem;color:var(--muted);line-height:1.6;margin:0}
.ticket-price{font-family:var(--ff-display);font-size:1.4rem;color:var(--brand);white-space:nowrap}
.ticket-controls{display:flex;align-items:center;gap:14px}

/* ============================================================
   10. GALLERY / SOCIAL
   ============================================================ */
.gallery-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.gallery-grid a:nth-child(1){grid-column:span 2;grid-row:span 2}
.gallery-grid a:nth-child(6){grid-column:span 2}
@media(max-width:820px){
  .gallery-grid{grid-template-columns:repeat(2,1fr)}
  .gallery-grid a:nth-child(1){grid-column:span 2;grid-row:span 1}
  .gallery-grid a:nth-child(6){grid-column:span 2}
}
@media(max-width:520px){.gallery-grid{grid-template-columns:repeat(2,1fr)}}

/* ============================================================
   11. CTA BAND
   ============================================================ */
.cta-band{
  background:var(--brand);color:#fff;padding:clamp(52px,7vw,88px) 0;text-align:center;
  position:relative;overflow:hidden;
}
.cta-band::before{
  content:'';position:absolute;inset:0;opacity:.16;
  background:radial-gradient(circle at 20% 20%,var(--sand) 0%,transparent 45%),
             radial-gradient(circle at 82% 78%,var(--sand) 0%,transparent 42%);
}
.cta-band .container{position:relative;z-index:2}

/* ============================================================
   12. FOOTER
   ============================================================ */
.site-footer{background:var(--brand-dark);color:rgba(255,255,255,.72);padding-top:clamp(48px,6vw,78px);font-size:.9rem}
.footer-grid{display:grid;grid-template-columns:1.6fr 1fr 1fr 1.2fr;gap:clamp(28px,4vw,52px);padding-bottom:clamp(36px,5vw,60px)}
@media(max-width:980px){.footer-grid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.footer-grid{grid-template-columns:1fr}}
.footer-grid h4{
  font-size:.66rem;letter-spacing:.24em;text-transform:uppercase;color:var(--sand);
  margin-bottom:18px;font-family:var(--ff-body);font-weight:400;
}
.footer-grid ul li{margin-bottom:10px}
.footer-grid a{transition:color .3s}
.footer-grid a:hover{color:var(--sand)}
.footer-logo{font-family:var(--ff-display);font-size:1.4rem;letter-spacing:.24em;text-transform:uppercase;color:#fff;margin-bottom:16px}
.footer-logo span{color:var(--sand)}
.footer-desc{max-width:38ch;line-height:1.75;font-size:.88rem}
.socials{display:flex;gap:12px;margin-top:20px}
.socials a{
  width:38px;height:38px;border:1px solid rgba(219,193,172,.28);border-radius:50%;
  display:flex;align-items:center;justify-content:center;transition:.3s;
}
.socials a:hover{background:var(--sand);border-color:var(--sand);color:var(--brand-dark)}
.socials svg{width:16px;height:16px}
.footer-bottom{
  border-top:1px solid rgba(219,193,172,.14);padding:20px 22px;
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  font-size:.76rem;letter-spacing:.04em;
}
.footer-bottom a{opacity:.6}
.footer-bottom a:hover{opacity:1}

/* ============================================================
   13. ADMIN
   ============================================================ */
.admin-actions{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0}
#admin-json{
  width:100%;min-height:62vh;padding:18px;border:1px solid var(--line);border-radius:4px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.8rem;line-height:1.6;
  background:#FCFAF8;resize:vertical;
}
.admin-note{font-size:.8rem;color:var(--muted);margin-top:14px;max-width:70ch}
.status-msg{font-size:.82rem;color:var(--brand);margin-top:10px;min-height:1.2em}

/* ============================================================
   14. MISC
   ============================================================ */
.reveal{opacity:0;transform:translateY(26px);transition:opacity .9s cubic-bezier(.2,.7,.3,1),transform .9s cubic-bezier(.2,.7,.3,1)}
.reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){
  .reveal{opacity:1;transform:none;transition:none}
  .hero-slide.active .hero-media img{animation:none}
  html{scroll-behavior:auto}
}
.page-head{padding:calc(var(--header-h) + clamp(40px,7vw,80px)) 0 clamp(30px,5vw,56px);background:var(--sand-soft)}
.breadcrumb{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.breadcrumb a:hover{color:var(--brand)}
.info-list li{display:flex;justify-content:space-between;gap:18px;padding:13px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.info-list li span:first-child{color:var(--muted);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;padding-top:3px}
.info-list li span:last-child{text-align:right}
.map-frame{width:100%;height:100%;min-height:320px;border:0;display:block;filter:grayscale(.25) contrast(1.05)}
</style>

<script>
/* ============================================================
   VILLA DEVONTÉ — APPLICATION SCRIPT
   ------------------------------------------------------------
   1.  Data loading (JSON)
   2.  Utilities
   3.  Components
   4.  Views
   5.  Router
   6.  Cart / Order tray
   7.  WhatsApp helpers
   8.  Forms
   9.  Admin
   10. Init
   ============================================================ */

/* ------------------------------------------------------------
   1. DATA LOADING
   ------------------------------------------------------------ */
/* To load content from an external file instead of the inline JSON
   above, set DATA_URL to e.g. './data/site-data.json' and make sure
   the file is served over HTTP(S). */
const DATA_URL = null;

let DATA = null;
let DEFAULTS = null;

async function loadData() {
  DEFAULTS = JSON.parse(document.getElementById('site-data').textContent);

  // 1. Staff edits saved locally via the admin panel take priority
  const stored = localStorage.getItem('vd_site_data');
  if (stored) {
    try { DATA = JSON.parse(stored); return; } catch (e) { /* fall through */ }
  }
  // 2. Optional external JSON file
  if (DATA_URL) {
    try {
      const res = await fetch(DATA_URL, { cache: 'no-cache' });
      if (res.ok) { DATA = await res.json(); return; }
    } catch (e) { /* fall through */ }
  }
  // 3. Inline JSON
  DATA = DEFAULTS;
}

const S = () => DATA.site;
const L = () => DATA.whatsappLabels;

/* ------------------------------------------------------------
   2. UTILITIES
   ------------------------------------------------------------ */
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
));

function money(n) {
  const v = Number(n) || 0;
  return S().currency + v.toLocaleString('en-NG');
}

/* Branded SVG placeholder — shown if an image fails to load
   or if an "image" value in the JSON is left empty. */
function PH(label, w, h) {
  w = w || 1200; h = h || 900;
  const safe = String(label == null ? 'Villa Devonté' : label).replace(/[<>&]/g, '');
  const svg =
    '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '">' +
      '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
        '<stop offset="0%" stop-color="#492A15"/><stop offset="100%" stop-color="#2E1A0D"/>' +
      '</linearGradient></defs>' +
      '<rect width="' + w + '" height="' + h + '" fill="url(#g)"/>' +
      '<text x="50%" y="50%" fill="#DBC1AC" fill-opacity="0.55" font-family="Georgia,serif" ' +
        'font-size="' + Math.round(w / 24) + '" text-anchor="middle" dominant-baseline="middle">' + safe + '</text>' +
    '</svg>';
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
window.PH = PH;
window.imgFail = function (el) {
  el.onerror = null;
  el.src = PH(el.dataset.fb || 'Villa Devonté');
};

/* Image tag with automatic fallback */
function img(src, alt, fb, cls, eager) {
  const src2 = (src && String(src).trim()) ? src : PH(fb || alt);
  return '<img src="' + esc(src2) + '" alt="' + esc(alt || '') + '"' +
    ' data-fb="' + esc(fb || alt || 'Villa Devonté') + '"' +
    (cls ? ' class="' + cls + '"' : '') +
    (eager ? ' fetchpriority="high"' : ' loading="lazy" decoding="async"') +
    ' onerror="imgFail(this)">';
}

function formatDate(iso, fallback) {
  if (fallback) return fallback;
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' });
}

/* ------------------------------------------------------------
   3. WHATSAPP HELPERS
   ------------------------------------------------------------ */
function waNumber() {
  return String(S().whatsapp || '').replace(/\D/g, '');
}

/**
 * Build a wa.me deep link with a pre-filled, clearly-labelled message.
 * @param {string} label  e.g. "ROOM RESERVATION"
 * @param {string[]} lines  body lines
 */
function waLink(label, lines) {
  lines = lines || [];
  const parts = ['VILLA DEVONTÉ — ' + label, '————————————————', ...lines];
  const text = parts.join('\n');
  return 'https://wa.me/' + waNumber() + '?text=' + encodeURIComponent(text);
}

function openWhatsApp(label, lines) {
  window.open(waLink(label, lines), '_blank', 'noopener');
}

/* ------------------------------------------------------------
   4. COMPONENTS
   ------------------------------------------------------------ */
function sectionHead(eyebrow, title, lead, center) {
  return '<div class="sec-head' + (center ? ' center' : '') + ' reveal">' +
    (eyebrow ? '<span class="eyebrow">' + esc(eyebrow) + '</span>' : '') +
    '<h2 class="h-section mb-2">' + esc(title) + '</h2>' +
    (lead ? '<p class="lead">' + esc(lead) + '</p>' : '') +
  '</div>';
}

function roomCard(r, i) {
  return '<article class="card reveal" style="transition-delay:' + (i % 3) * 90 + 'ms">' +
    '<a class="media ratio-4x3" href="#/rooms/' + esc(r.id) + '">' +
      img(r.image, r.name, r.name) +
    '</a>' +
    '<div class="card-body">' +
      '<span class="card-meta">' + esc(r.occupancy) + ' · ' + esc(r.bed) + '</span>' +
      '<h3 class="card-title"><a href="#/rooms/' + esc(r.id) + '">' + esc(r.name) + '</a></h3>' +
      '<p class="card-text">' + esc(r.short) + '</p>' +
      '<div class="card-foot">' +
        '<div class="card-price">' + money(r.price) + '<small>' + esc(r.priceUnit) + '</small></div>' +
        '<div class="btn-row">' +
          '<a class="btn btn-outline btn-sm" href="#/rooms/' + esc(r.id) + '">VIEW ROOM</a>' +
          '<a class="btn btn-primary btn-sm" href="' + waLink(L().room, [
            'Room: ' + r.name,
            'Rate: ' + money(r.price) + ' ' + r.priceUnit,
            '',
            'Name:',
            'Phone:',
            'Check-in:',
            'Check-out:',
            'Guests:',
            'Requests:'
          ]) + '" target="_blank" rel="noopener">RESERVE NOW</a>' +
        '</div>' +
      '</div>' +
    '</div>' +
  '</article>';
}

function menuItemRow(item) {
  return '<div class="menu-item" data-item-id="' + esc(item.id) + '">' +
    '<div class="menu-item-media">' + img(item.image, item.name, item.name) + '</div>' +
    '<div class="menu-item-main">' +
      '<div class="menu-item-top">' +
        '<div>' +
          '<div class="menu-item-name">' + esc(item.name) + '</div>' +
          (item.tag ? '<span class="tag" style="margin-top:6px">' + esc(item.tag) + '</span>' : '') +
        '</div>' +
        '<div class="menu-item-price">' + money(item.price) + '</div>' +
      '</div>' +
      '<p class="menu-item-desc">' + esc(item.desc) + '</p>' +
      '<div class="menu-item-actions">' +
        '<div class="qty" data-qty-for="' + esc(item.id) + '">' +
          '<button type="button" data-action="qty-dec" aria-label="Decrease quantity">−</button>' +
          '<span class="qty-val" data-qty-val="' + esc(item.id) + '">1</span>' +
          '<button type="button" data-action="qty-inc" aria-label="Increase quantity">+</button>' +
        '</div>' +
        '<button type="button" class="btn btn-primary btn-sm" data-action="add-item" data-id="' + esc(item.id) + '">ADD TO ORDER</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function eventCard(ev, i) {
  const d = new Date(ev.date + 'T00:00:00');
  const day = isNaN(d) ? '' : d.getDate();
  const mon = isNaN(d) ? '' : d.toLocaleDateString('en-GB', { month: 'short' });
  return '<article class="card event-card reveal" style="transition-delay:' + (i % 3) * 90 + 'ms">' +
    '<a class="media ratio-3x2" href="#/events/' + esc(ev.id) + '">' +
      img(ev.image, ev.title, ev.title) +
      '<div class="event-date"><b>' + day + '</b><span>' + mon + '</span></div>' +
    '</a>' +
    '<div class="card-body">' +
      '<span class="card-meta">' + esc(ev.dateLabel || formatDate(ev.date)) + ' · ' + esc(ev.time) + '</span>' +
      '<h3 class="card-title"><a href="#/events/' + esc(ev.id) + '">' + esc(ev.title) + '</a></h3>' +
      '<p class="card-text">' + esc(ev.short) + '</p>' +
      '<div class="card-foot">' +
        '<span class="card-meta" style="opacity:.7">' + esc(ev.location) + '</span>' +
        '<div class="btn-row">' +
          '<a class="btn btn-outline btn-sm" href="#/events/' + esc(ev.id) + '">DETAILS</a>' +
          (ev.tickets && ev.tickets.length
            ? '<a class="btn btn-primary btn-sm" href="#/events/' + esc(ev.id) + '">GET TICKETS</a>'
            : '<a class="btn btn-outline btn-sm" href="#/events/' + esc(ev.id) + '">VIEW GALLERY</a>') +
        '</div>' +
      '</div>' +
    '</div>' +
  '</article>';
}

/* ------------------------------------------------------------
   5. VIEWS
   ------------------------------------------------------------ */

/* ---------- HOME ---------- */
function viewHome() {
  const h = DATA.hero.slides;
  const slides = h.map((s, i) => {
    const primary = s.primary || {};
    const secondary = s.secondary || {};
    let primaryHtml = '';
    if (primary.waLabel) {
      primaryHtml = '<a class="btn btn-sand" href="' +
        waLink(primary.waLabel, [primary.waLines || '']) +
        '" target="_blank" rel="noopener">' + esc(primary.label) + '</a>';
    } else {
      primaryHtml = '<a class="btn btn-sand" href="' + esc(primary.href || '#/reservation') + '">' + esc(primary.label) + '</a>';
    }
    return '<div class="hero-slide' + (i === 0 ? ' active' : '') + '" data-slide-index="' + i + '">' +
      '<div class="hero-media">' + img(s.image, s.title, 'Villa Devonté', '', true) + '</div>' +
      '<div class="hero-overlay"></div>' +
      '<div class="container hero-content">' +
        '<span class="hero-kicker">' + esc(s.kicker) + '</span>' +
        '<h1 class="hero-title">' + esc(s.title) + '</h1>' +
        '<p class="hero-sub">' + esc(s.subtitle) + '</p>' +
        '<div class="hero-actions">' + primaryHtml +
          '<a class="btn btn-ghost" href="' + esc(secondary.href || '#/about') + '">' + esc(secondary.label || 'EXPLORE') + '</a>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');

  const dots = h.map((_, i) =>
    '<button class="hero-dot' + (i === 0 ? ' active' : '') + '" data-action="hero-dot" data-index="' + i + '" aria-label="Go to slide ' + (i + 1) + '"></button>'
  ).join('');

  const w = DATA.welcome;

  const expCards = DATA.experiences.map((e, i) =>
    '<a class="card reveal" href="' + esc(e.href) + '" style="transition-delay:' + (i % 4) * 80 + 'ms">' +
      '<div class="media ratio-3x2">' + img(e.image, e.title, e.title) + '</div>' +
      '<div class="card-body">' +
        '<h3 class="card-title">' + esc(e.title) + '</h3>' +
        '<p class="card-text">' + esc(e.text) + '</p>' +
        '<span class="card-meta" style="margin-top:auto">' + esc(e.cta) + ' →</span>' +
      '</div>' +
    '</a>'

/* ------------------------------------------------------------
   6. CART / ORDER TRAY
   ------------------------------------------------------------ */
let CART = [];

function cartLoad() {
  try {
    const raw = localStorage.getItem('vd_cart');
    CART = raw ? JSON.parse(raw) : [];
    if (!Array.isArray(CART)) CART = [];
  } catch (e) { CART = []; }
}
function cartSave() {
  try { localStorage.setItem('vd_cart', JSON.stringify(CART)); } catch (e) {}
  renderTray();
}
function findItem(id) {
  for (const c of DATA.menu.categories) {
    const it = c.items.find(x => x.id === id);
    if (it) return { item: it, category: c };
  }
  return null;
}
function cartAdd(id, qty) {
  const found = findItem(id);
  if (!found) return;
  const existing = CART.find(x => x.id === id);
  if (existing) existing.qty += qty;
  else CART.push({ id: id, qty: qty, type: found.category.type, name: found.item.name, price: found.item.price });
  cartSave();
}
function cartClear() { CART = []; cartSave(); }

function renderTray() {
  const tray = document.getElementById('orderTray');
  if (!tray) return;
  const count = CART.reduce((s, x) => s + x.qty, 0);
  const total = CART.reduce((s, x) => s + x.qty * x.price, 0);

  if (count === 0) {
    tray.classList.remove('open');
    tray.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('tray-open');
    return;
  }
  tray.classList.add('open');
  tray.setAttribute('aria-hidden', 'false');
  document.body.classList.add('tray-open');

  document.getElementById('trayCount').textContent = count + (count === 1 ? ' item selected' : ' items selected');
  document.getElementById('trayTotal').textContent = money(total);
}

function buildOrderMessage() {
  const types = new Set(CART.map(x => x.type));
  let label = L().food;
  if (types.size === 1) label = types.has('drink') ? L().drink : L().food;
  else label = L().foodDrink;

  const lines = CART.map((x, i) => (i + 1) + '. ' + x.name + ' × ' + x.qty + ' — ' + money(x.qty * x.price));
  const total = CART.reduce((s, x) => s + x.qty * x.price, 0);

  lines.push('');
  lines.push('TOTAL: ' + money(total));
  lines.push('');
  lines.push('Name:');
  lines.push('Phone:');
  lines.push('Delivery to (table / room / address):');
  lines.push('Notes:');

  return { label: label, lines: lines };
}

   7. FORMS → WHATSAPP
   ------------------------------------------------------------ */
const FIELD_LABELS = {
  name: 'Name',
  phone: 'Phone',
  checkin: 'Check-in',
  checkout: 'Check-out',
  guests: 'Guests',
  room: 'Room',
  notes: 'Requests',
  date: 'Date',
  session: 'Session',
  package: 'Package',
  occasion: 'Occasion',
  tickets: 'Tickets'
};

function handleFormSubmit(e) {
  const form = e.target.closest('form[data-wa-form]');
  if (!form) return;
  e.preventDefault();

  const kind = form.dataset.waForm;

  /* --- Event ticket purchase --- */
  if (kind === 'event') {
    const evName = form.dataset.event || '';
    const evDate = form.dataset.eventdate || '';
    const lines = ['Event: ' + evName, 'Date: ' + evDate, ''];
    let total = 0;
    let any = false;

    form.querySelectorAll('input[data-ticket]').forEach(inp => {
      const q = parseInt(inp.value, 10) || 0;
      if (q > 0) {
        any = true;
        const price = Number(inp.dataset.price) || 0;
        total += price * q;
        lines.push('• ' + inp.dataset.ticket + ' × ' + q + ' — ' + money(price * q));
      }
    });

    if (!any) {
      alert('Please select at least one ticket before continuing.');
      return;
    }

    lines.push('', 'TOTAL: ' + money(total), '');
    const fd = new FormData(form);
    if (fd.get('name')) lines.push('Name: ' + fd.get('name'));
    if (fd.get('phone')) lines.push('Phone: ' + fd.get('phone'));

    openWhatsApp(L().event, lines);
    return;
  }

  /* --- Generic forms (reservation, room, hot tub, lounge) --- */
  const labelMap = {
    reservation: L().room,
    room: L().room,
    hottub: L().hotTub,
    lounge: L().lounge
  };
  let label = labelMap[kind] || L().service;

  const lines = [];

  if (kind === 'room' && form.dataset.room) {
    lines.push('Room: ' + form.dataset.room);
    const r = DATA.rooms.find(x => x.name === form.dataset.room);
    if (r) lines.push('Rate: ' + money(r.price) + ' ' + r.priceUnit);
    lines.push('');
  }

  const fd = new FormData(form);
  fd.forEach((value, key) => {
    if (value == null || String(value).trim() === '') return;
    const lbl = FIELD_LABELS[key] || key.charAt(0).toUpperCase() + key.slice(1);
    lines.push(lbl + ': ' + value);
  });

  openWhatsApp(label, lines);
}

/* ------------------------------------------------------------
   8. HERO CAROUSEL
   ------------------------------------------------------------ */
let heroTimer = null;

function initHero() {
  const slides = Array.from(document.querySelectorAll('.hero-slide'));
  if (!slides.length) return;

  const dots = Array.from(document.querySelectorAll('.hero-dot'));
  let index = 0;

  function show(n) {
    slides[index].classList.remove('active');
    if (dots[index]) dots[index].classList.remove('active');
    index = ((n % slides.length) + slides.length) % slides.length;
    // restart ken-burns by forcing reflow
    const el = slides[index];
    el.classList.add('active');
    const im = el.querySelector('img');
    if (im) { im.style.animation = 'none'; void im.offsetWidth; im.style.animation = ''; }
    if (dots[index]) {
      dots[index].classList.remove('active');
      void dots[index].offsetWidth;
      dots[index].classList.add('active');
    }
  }

  function start() {
    stop();
    heroTimer = setInterval(() => show(index + 1), 6500);
  }
  function stop() {
    if (heroTimer) { clearInterval(heroTimer); heroTimer = null; }
  }

  window.__hero = {
    next: () => { show(index + 1); start(); },
    prev: () => { show(index - 1); start(); },
    go: (i) => { show(i); start(); }
  };

  // Pause on hover (desktop) / when tab hidden
  const heroEl = document.getElementById('hero');
  if (heroEl) {
    heroEl.addEventListener('mouseenter', stop);
    heroEl.addEventListener('mouseleave', start);
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) stop(); else start();
  });

  start();
}

function stopHero() {
  if (heroTimer) { clearInterval(heroTimer); heroTimer = null; }
}

/* ------------------------------------------------------------
   9. ROUTER
   ------------------------------------------------------------ */
function parseRoute() {
  const raw = location.hash.replace(/^#\/?/, '');
  const parts = raw.split('?')[0].split('/').filter(Boolean).map(decodeURIComponent);
  return parts;
}

function router() {
  const parts = parseRoute();
  const root = parts[0] || 'home';
  const param = parts[1] || null;

  let html = '';

  switch (root) {
    case 'home':        html = viewHome(); break;
    case 'about':       html = viewAbout(); break;
    case 'rooms':       html = param ? viewRoomDetail(param) : viewRooms(); break;
    case 'restaurant':  html = viewRestaurant(); break;
    case 'lounge':      html = viewLounge(); break;
    case 'hot-tub':     html = viewHotTub(); break;
    case 'menu':        html = viewMenu(); break;
    case 'events':      html = param ? viewEventDetail(param) : viewEvents('upcoming'); break;
    case 'reservation': html = viewReservation(); break;
    case 'contact':     html = viewContact(); break;
    case 'admin':       html = viewAdmin(); break;
    default:            html = view404();
  }

  stopHero();
  document.getElementById('app').innerHTML = html;

  // Scroll to top on navigation
  window.scrollTo(0, 0);

  // Post-render work
  document.body.dataset.route = root;
  updateActiveNav(root);
  updateHeaderState();
  initHero();
  observeReveal();
  renderTray();
  updateDocumentMeta(root, param);
}

function updateActiveNav(root) {
  document.querySelectorAll('#mainNav a, #drawerNav a').forEach(a => {
    const href = a.getAttribute('href') || '';
    const seg = href.replace(/^#\/?/, '').split('/')[0] || 'home';
    a.classList.toggle('active', seg === root);
  });
}

/* ------------------------------------------------------------
   11. REVEAL ANIMATIONS
   ------------------------------------------------------------ */
function observeReveal() {
  const els = document.querySelectorAll('.reveal:not(.in)');
  if (!els.length) return;
  if (!('IntersectionObserver' in window)) {
    els.forEach(el => el.classList.add('in'));
    return;
  }
  const io = new IntersectionObserver((entries) => {
    entries.forEach(en => {
      if (en.isIntersecting) {
        en.target.classList.add('in');
        io.unobserve(en.target);
      }
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });
  els.forEach(el => io.observe(el));
}

  drawerNav.innerHTML = DATA.nav.map((x, i) =>
    '<a href="' + esc(x.href) + '">' + esc(x.label) + '<small>' + String(i + 1).padStart(2, '0') + '</small></a>'
  ).join('');
}

/* ------------------------------------------------------------
   13. MOBILE DRAWER
   ------------------------------------------------------------ */
function openDrawer() {
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawer').setAttribute('aria-hidden', 'false');
  document.body.classList.add('no-scroll');
  document.getElementById('hamburger').setAttribute('aria-expanded', 'true');
}
function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawer').setAttribute('aria-hidden', 'true');
  document.body.classList.remove('no-scroll');
  document.getElementById('hamburger').setAttribute('aria-expanded', 'false');
}

/* ------------------------------------------------------------
   14. ADMIN ACTIONS
   ------------------------------------------------------------ */
function adminStatus(msg, color) {
  const el = document.getElementById('adminStatus');
  if (!el) return;
  el.textContent = msg;
  el.style.color = color || 'var(--brand)';
  setTimeout(() => { el.textContent = ''; }, 4000);
}

function adminSave() {
  const ta = document.getElementById('admin-json');
  if (!ta) return;
  try {
    const parsed = JSON.parse(ta.value);
    localStorage.setItem('vd_site_data', JSON.stringify(parsed));
    DATA = parsed;
    renderNav();
    renderFooter();
    router();
    adminStatus('Saved. Changes are now live in this browser.', '#2f7d43');
  } catch (err) {
    adminStatus('Invalid JSON: ' + err.message, '#b3261e');
  }
}

function adminExport() {
  const ta = document.getElementById('admin-json');
  if (!ta) return;
  try {
    JSON.parse(ta.value);
  } catch (err) {
    adminStatus('Invalid JSON: ' + err.message, '#b3261e');
    return;
  }
  const blob = new Blob([ta.value], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'site-data.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  adminStatus('Downloaded site-data.json', '#2f7d43');
}

function adminCopy() {
  const ta = document.getElementById('admin-json');
  if (!ta) return;
  ta.select();
  try {
    document.execCommand('copy');
    adminStatus('Copied to clipboard.', '#2f7d43');
  } catch (e) {
    adminStatus('Copy failed — select and copy manually.', '#b3261e');
  }
}

function adminReset() {
  if (!confirm('Restore the published data? Any unsaved local edits will be lost.')) return;
  localStorage.removeItem('vd_site_data');
  DATA = JSON.parse(document.getElementById('site-data').textContent);
  renderNav();
  renderFooter();
  router();
  adminStatus('Published data restored.', '#2f7d43');
}

/* ------------------------------------------------------------
   15. GLOBAL EVENT DELEGATION
   ------------------------------------------------------------ */
document.addEventListener('click', function (e) {
  /* data-action handlers */
  const actionEl = e.target.closest('[data-action]');
  if (actionEl) {
    const action = actionEl.dataset.action;

    switch (action) {
      case 'hero-next': if (window.__hero) window.__hero.next(); return;
      case 'hero-prev': if (window.__hero) window.__hero.prev(); return;
      case 'hero-dot':  if (window.__hero) window.__hero.go(parseInt(actionEl.dataset.index, 10)); return;

      case 'qty-inc':
      case 'qty-dec': {
        const wrap = actionEl.closest('.qty');
        if (!wrap) return;
        const valEl = wrap.querySelector('.qty-val');
        let v = parseInt(valEl.textContent || valEl.value || '1', 10) || 1;
        v = action === 'qty-inc' ? v + 1 : Math.max(1, v - 1);
        if (valEl.tagName === 'INPUT') valEl.value = v; else valEl.textContent = v;
        return;
      }

      case 'ticket-inc':
      case 'ticket-dec': {
        const wrap = actionEl.closest('.qty');
        if (!wrap) return;
        const input = wrap.querySelector('input');
        let v = parseInt(input.value, 10) || 0;
        v = action === 'ticket-inc' ? v + 1 : Math.max(0, v - 1);
        input.value = v;
        return;
      }

      case 'add-item': {
        const id = actionEl.dataset.id;
        const wrap = document.querySelector('.qty[data-qty-for="' + id + '"]');
        const valEl = wrap ? wrap.querySelector('.qty-val') : null;
        const qty = valEl ? (parseInt(valEl.textContent, 10) || 1) : 1;
        cartAdd(id, qty);
        if (valEl) valEl.textContent = '1';
        actionEl.textContent = 'ADDED ✓';
        setTimeout(() => { actionEl.textContent = 'ADD TO ORDER'; }, 1200);
        return;
      }

      case 'tray-clear':
        cartClear();
        return;

      case 'tray-order': {
        if (!CART.length) return;
        const msg = buildOrderMessage();
        openWhatsApp(msg.label, msg.lines);
        return;
      }

      case 'menu-cat': {
        const cat = actionEl.dataset.cat;
        document.querySelectorAll('.menu-tab').forEach(t => t.classList.toggle('active', t === actionEl));
        document.querySelectorAll('[data-cat-section]').forEach(sec => {
          sec.hidden = !(cat === 'all' || sec.dataset.catSection === cat);
        });
        return;
      }

      case 'event-tab': {
        const tab = actionEl.dataset.tab;
        document.querySelectorAll('.tabbar button').forEach(b => b.classList.toggle('active', b === actionEl));
        const app = document.getElementById('app');
        // re-render only the grid
        const grid = app.querySelector('.grid.g-3, .section .lead.center');
        const list = tab === 'previous' ? (DATA.events.previous || []) : (DATA.events.upcoming || []);
        const wrap = app.querySelector('.container .grid, .container > .lead.center');
        if (wrap) {
          if (list.length) {
            const div = document.createElement('div');
            div.className = 'grid g-3';
            div.innerHTML = list.map(eventCard).join('');
            wrap.replaceWith(div);
          } else {
            const p = document.createElement('p');
            p.className = 'lead center';
            p.textContent = 'Nothing here yet — check back soon.';
            wrap.replaceWith(p);
          }
        } else {
          // fallback: full re-render
          document.getElementById('app').innerHTML = viewEvents(tab);
        }
        observeReveal();
        return;
      }

      case 'admin-save':   adminSave(); return;
      case 'admin-export': adminExport(); return;
      case 'admin-copy':   adminCopy(); return;
      case 'admin-reset':  adminReset(); return;
    }
  }

  /* Any element with data-wa builds a WhatsApp link on the fly */
  const waEl = e.target.closest('[data-wa]');
  if (waEl) {
    // only intercept if it is an <a href="#"> placeholder
    const href = waEl.getAttribute('href');
    if (href === '#') {
      e.preventDefault();
      const label = waEl.dataset.wa;
      const lines = (waEl.dataset.waLines || '').split('|').filter(Boolean);
      openWhatsApp(label, lines);
      return;
    }
  }

  /* Close drawer when a link inside it is clicked */
  if (e.target.closest('#drawerNav a, .drawer-foot a')) {
    closeDrawer();
  }
});

document.addEventListener('submit', handleFormSubmit);

/* ------------------------------------------------------------
   16. INIT
   ------------------------------------------------------------ */
async function init() {
  await loadData();

  renderNav();
  renderFooter();

  // Floating WhatsApp button
  const float = document.getElementById('waFloat');
  float.href = waLink(L().service, ['Hello Villa Devonté, I would like to speak with customer service.']);
  float.target = '_blank';
  float.rel = 'noopener';

  // Drawer controls
  document.getElementById('hamburger').addEventListener('click', openDrawer);
  document.getElementById('drawerClose').addEventListener('click', closeDrawer);

  // Keyboard: ESC closes drawer
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeDrawer();
  });

  // Routing
  window.addEventListener('hashchange', router);

  // Scroll
  window.addEventListener('scroll', onScroll, { passive: true });

  // Cart
  cartLoad();

  // First render
  router();
}

init();
</script>
